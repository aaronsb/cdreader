name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from tags, so it needs history
          fetch-depth: 0

      - name: Install system dependencies
        # libdiscid is required at import time; flac is used by the tagging tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libdiscid0 flac cdparanoia eject

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest tests/ -q
