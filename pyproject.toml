[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cdripper"
dynamic = ["version"]
description = "Rip audio CDs to FLAC with MusicBrainz metadata"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "discid",
    "musicbrainzngs",
    "mutagen",
    "rich",
    # tomllib is stdlib from 3.11; older versions need the backport to read
    # metadata.toml. Writing it needs neither.
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "build",
]

[project.scripts]
cdripper = "cdripper:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[project.urls]
Homepage = "https://github.com/aaronsb/cdreader"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
]
ignore = [
    "B008",  # function call in default arg -- not a pattern used here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long assertion lines are fine in tests
